# SwiftLint configuration for deviceterm.
# See AGENTS.md "Code Style" for the rules reviewers enforce on top of these.

strict: true                    # any lint warning fails `make lint`

included:
  - Sources
  - Tests

excluded:
  - .build
  - Sources/CoreSimulatorBridge/PrivateHeaders  # idb-derived private headers
  - "**/*.generated.swift"      # any future codegen output

line_length:
  warning: 120
  error: 120                    # hard cap — wrap long lines

indentation_width:
  # Multi-line string literals (`"""…"""`) carry payload (shell scripts,
  # help text, prose) whose internal indentation is intentional and not
  # Swift code. Skip them so the rule doesn't flag legitimate string
  # content on the few files that embed scripts (HelpText, AgentsText,
  # SessionEnvironment's shell-init blocks, etc.).
  include_multiline_strings: false

nesting:
  # Allow 2 levels of type nesting so the namespace-enum + nested-
  # Codable + nested-CodingKeys idiom works without flattening:
  #     enum SessionMethods { struct CloseResponse { enum CodingKeys {} } }
  # CodingKeys is the standard Swift idiom for wire-key customization
  # and lives inside the type whose keys it describes.
  type_level: 2

identifier_name:
  # SwiftLint replaces the entire default `excluded` list when this
  # block is present, so we re-add the upstream defaults (`id`, `URL`)
  # explicitly. The POSIX-flavored bridge layer uses universally-
  # recognized two-letter names that don't deserve to get renamed
  # to `descriptor` / `address` / `byteCount` throughout.
  excluded:
    - id        # ubiquitous in Identifiable + RPC correlation
    - URL       # initialism, conventional Swift naming
    - fd        # file descriptor
    - sa        # struct sockaddr pointer
    - n         # byte count from read/write
    - rc        # syscall return code
    - x         # 2D coordinate; pane input + Metal layout
    - y         # 2D coordinate; pane input + Metal layout
    - ok        # JSON success indicator on RPC acks + CLI receipts
    - ts        # JSON ISO-8601 timestamp field on daemon events

file_header:
  # Swift sources under the `included` paths open with the SPDX identifier,
  # so the license travels with a file lifted out of the repo. Package.swift
  # is not linted here; SwiftPM owns its first line, so its identifier sits
  # directly below `swift-tools-version`. The vendored idb headers are MIT
  # and are excluded above, so they keep their own upstream notices.
  required_pattern: '\A// SPDX-License-Identifier: GPL-3\.0-or-later'
  # The identifier is the whole header: prose describing a declaration
  # belongs on it as `///`, and prose describing the file itself goes below
  # the imports. `(?!/)` spares a `///` doc comment that opens the file when
  # there are no imports to sit under, which is why this cannot be a plain
  # `^//`. A `//` block below the imports is outside the header region the
  # rule inspects and passes.
  forbidden_pattern: '(?m)^//(?!/)(?! SPDX-License-Identifier)'

opt_in_rules:
  - array_init
  - async_without_await
  - attributes
  - file_header
  - file_name
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - direct_return
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - extension_access_modifier
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - indentation_width
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - number_separator
  - one_declaration_per_file
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - superfluous_else
  - switch_case_on_newline
  - toggle_bool
  - type_contents_order
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unneeded_throws_rethrows
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Analyzer-only rules (require `swiftlint analyze`, not `swiftlint lint`).
# Wire `make analyze` separately when Swift sources are present.
analyzer_rules:
  - unused_import

disabled_rules:
  - closure_body_length
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - type_body_length
  # Architectural size / branching tradeoffs are decided in code review,
  # not by SwiftLint thresholds. Reviewers push back on real complexity;
  # the linter shouldn't make us split files for the sake of a rule.
  - inclusive_language
  # POSIX-derived names ("master FD", "slave PTY", "sockaddr", etc.) are
  # the actual on-the-wire terms in `<util.h>` / `<sys/socket.h>` and in
  # the kernel docs we reference. Renaming them for our own files would
  # break the very greppability that makes the bridge layer reviewable;
  # the right move is to keep the standard term and let the comment
  # explain it.

type_contents_order:
  order:
    - case
    - type_alias
    - associated_type
    - subtype
    - type_property
    - instance_property
    - ib_inspectable
    - ib_outlet
    - initializer
    - deinitializer
    - type_method
    - view_life_cycle_method
    - ib_action
    - other_method
    - subscript
